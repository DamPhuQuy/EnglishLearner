<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%" style="background:#0f172a; font-family:system-ui,-apple-system,sans-serif;">
  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700">Smartphone Adoption Across Age Demographics (2012–2022)</text>
  <text x="380" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">Percentage of European Population Utilizing Smartphones Daily (%)</text>

  <!-- Gridlines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4,4">
    <line x1="90" y1="70" x2="710" y2="70" />
    <line x1="90" y1="122" x2="710" y2="122" />
    <line x1="90" y1="174" x2="710" y2="174" />
    <line x1="90" y1="226" x2="710" y2="226" />
    <line x1="90" y1="278" x2="710" y2="278" />
  </g>
  <line x1="90" y1="330" x2="710" y2="330" stroke="#64748b" stroke-width="1.5" />

  <!-- Y labels -->
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="80" y="74">100%</text>
    <text x="80" y="126">80%</text>
    <text x="80" y="178">60%</text>
    <text x="80" y="230">40%</text>
    <text x="80" y="282">20%</text>
    <text x="80" y="334">0%</text>
  </g>

  <!-- X axis labels & vertical guidelines -->
  <g fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">
    <text x="140" y="352">2012</text>
    <text x="250" y="352">2014</text>
    <text x="360" y="352">2016</text>
    <text x="470" y="352">2018</text>
    <text x="580" y="352">2020</text>
    <text x="690" y="352">2022</text>
  </g>

  <!-- Lines -->
  <!-- 18-29 -->
  <path d="M 140,143 L 250,120 L 360,104 L 470,94 L 580,83 L 690,76" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
  <!-- 30-49 -->
  <path d="M 140,190 L 250,167 L 360,141 L 470,120 L 580,102 L 690,91" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <!-- 50-64 -->
  <path d="M 140,250 L 250,221 L 360,174 L 470,154 L 580,138 L 690,122" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <!-- 65+ -->
  <path d="M 140,294 L 250,273 L 360,245 L 470,219 L 580,200 L 690,180" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />

  <!-- Dots & Values for Line 1 (18-29) -->
  <circle cx="140" cy="143" r="4.5" fill="#c084fc" stroke="#581c87" stroke-width="2"/><circle cx="250" cy="120" r="4.5" fill="#c084fc" stroke="#581c87" stroke-width="2"/><circle cx="360" cy="104" r="4.5" fill="#c084fc" stroke="#581c87" stroke-width="2"/><circle cx="470" cy="94" r="4.5" fill="#c084fc" stroke="#581c87" stroke-width="2"/><circle cx="580" cy="83" r="4.5" fill="#c084fc" stroke="#581c87" stroke-width="2"/><circle cx="690" cy="76" r="4.5" fill="#c084fc" stroke="#581c87" stroke-width="2"/>
  <!-- Dots for Line 2 (30-49) -->
  <circle cx="140" cy="190" r="4.5" fill="#34d399" stroke="#064e3b" stroke-width="2"/><circle cx="250" cy="167" r="4.5" fill="#34d399" stroke="#064e3b" stroke-width="2"/><circle cx="360" cy="141" r="4.5" fill="#34d399" stroke="#064e3b" stroke-width="2"/><circle cx="470" cy="120" r="4.5" fill="#34d399" stroke="#064e3b" stroke-width="2"/><circle cx="580" cy="102" r="4.5" fill="#34d399" stroke="#064e3b" stroke-width="2"/><circle cx="690" cy="91" r="4.5" fill="#34d399" stroke="#064e3b" stroke-width="2"/>
  <!-- Dots for Line 3 (50-64) -->
  <circle cx="140" cy="250" r="4.5" fill="#22d3ee" stroke="#164e63" stroke-width="2"/><circle cx="250" cy="221" r="4.5" fill="#22d3ee" stroke="#164e63" stroke-width="2"/><circle cx="360" cy="174" r="4.5" fill="#22d3ee" stroke="#164e63" stroke-width="2"/><circle cx="470" cy="154" r="4.5" fill="#22d3ee" stroke="#164e63" stroke-width="2"/><circle cx="580" cy="138" r="4.5" fill="#22d3ee" stroke="#164e63" stroke-width="2"/><circle cx="690" cy="122" r="4.5" fill="#22d3ee" stroke="#164e63" stroke-width="2"/>
  <!-- Dots for Line 4 (65+) -->
  <circle cx="140" cy="294" r="4.5" fill="#fb7185" stroke="#881337" stroke-width="2"/><circle cx="250" cy="273" r="4.5" fill="#fb7185" stroke="#881337" stroke-width="2"/><circle cx="360" cy="245" r="4.5" fill="#fb7185" stroke="#881337" stroke-width="2"/><circle cx="470" cy="219" r="4.5" fill="#fb7185" stroke="#881337" stroke-width="2"/><circle cx="580" cy="200" r="4.5" fill="#fb7185" stroke="#881337" stroke-width="2"/><circle cx="690" cy="180" r="4.5" fill="#fb7185" stroke="#881337" stroke-width="2"/>

  <!-- Final labels on 2022 endpoint -->
  <text x="702" y="80" fill="#c084fc" font-size="11" font-weight="700">98%</text>
  <text x="702" y="95" fill="#34d399" font-size="11" font-weight="700">92%</text>
  <text x="702" y="126" fill="#22d3ee" font-size="11" font-weight="700">80%</text>
  <text x="702" y="184" fill="#fb7185" font-size="11" font-weight="700">58%</text>

  <!-- Legend -->
  <g transform="translate(130, 385)">
    <line x1="0" y1="8" x2="20" y2="8" stroke="#a855f7" stroke-width="3" />
    <circle cx="10" cy="8" r="4" fill="#c084fc" />
    <text x="26" y="12" fill="#cbd5e1" font-size="12">18–29 yrs</text>

    <line x1="120" y1="8" x2="140" y2="8" stroke="#10b981" stroke-width="3" />
    <circle cx="130" cy="8" r="4" fill="#34d399" />
    <text x="146" y="12" fill="#cbd5e1" font-size="12">30–49 yrs</text>

    <line x1="240" y1="8" x2="260" y2="8" stroke="#06b6d4" stroke-width="3" />
    <circle cx="250" cy="8" r="4" fill="#22d3ee" />
    <text x="266" y="12" fill="#cbd5e1" font-size="12">50–64 yrs</text>

    <line x1="360" y1="8" x2="380" y2="8" stroke="#f43f5e" stroke-width="3" />
    <circle cx="370" cy="8" r="4" fill="#fb7185" />
    <text x="386" y="12" fill="#cbd5e1" font-size="12">65+ yrs</text>
  </g>
</svg>